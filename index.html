<script>
// Inside the admin preview (?preview), the admin page sends the content to show.
if (new URLSearchParams(location.search).has('preview')) {
  addEventListener('message', e => {
    if (e.origin !== location.origin) return;
    if (e.data?.type === 'cce-preview') renderPage(e.data.content);
    if (e.data?.type === 'cce-scroll') document.getElementById(e.data.id)?.scrollIntoView({ behavior: 'smooth' });
  });
  parent.postMessage({ type: 'cce-preview-ready' }, location.origin);
} else {
  // Saved content from the admin page first; the bundled default if nothing is saved (or offline / local preview).
  const load = url => fetch(url, { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)));
  load('/api/content')
    .then(c => c || Promise.reject(new Error('nothing saved yet')))
    .catch(() => load('data/default-content.json'))
    .then(c => renderPage(c))
    .catch(e => { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:80px 20px;color:#D97757">Could not load content: ' + e.message + '</p>'); });
}

// Nav turns solid once the hero is scrolled past (like tesla.com)
const nav = document.getElementById('nav'), hero = document.getElementById('top');
const onScroll = () => nav.classList.toggle('solid', window.scrollY > hero.offsetHeight - 70);
addEventListener('scroll', onScroll, { passive: true }); onScroll();
</script>
