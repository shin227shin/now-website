<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code on Earth</title>
<meta name="description" content="A casual cross-border community built around Claude Code.">
<!-- Link previews (Teams, Slack, Outlook, etc.) need full URLs -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Claude Code on Earth">
<meta property="og:title" content="Claude Code on Earth">
<meta property="og:description" content="A casual cross-border community built around Claude Code. Accenture &amp; Avanade.">
<meta property="og:url" content="https://claude-code-on-earth.netlify.app/">
<meta property="og:image" content="https://claude-code-on-earth.netlify.app/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Claude Code on Earth: dotted world map">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://claude-code-on-earth.netlify.app/assets/img/og.jpg">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<!-- The Earth's surface for the intro and the hero globe (assets/earth.js): start loading it first -->
<link rel="preload" href="assets/img/earth/surface-2048.webp" as="image">
<link rel="preload" href="assets/img/earth/land.webp" as="image">
<link rel="preload" href="assets/img/earth/clouds.webp" as="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>
// Opening intro (assets/intro.js): on every visit, but not in the admin preview, not when the link points to a section,
// and not for people whose device is set to reduce motion
if (!new URLSearchParams(location.search).has('preview') && !location.hash && !matchMedia('(prefers-reduced-motion: reduce)').matches)
  document.documentElement.classList.add('intro');
</script>
</head>
<body>
<div class="intro-ov" id="intro" aria-hidden="true"><canvas></canvas><span class="skip">Tap to skip</span></div>
<script src="assets/earth.js"></script>
<script src="assets/intro.js"></script>
<nav class="nav" id="nav">
  <a class="logo" href="#top">CLAUDE CODE <em>on Earth</em></a>
  <ul><li><a href="#community">Community</a></li><li><a href="#activities">Activities</a></li><li><a href="#next">Next Up</a></li><li><a href="#join">Join</a></li></ul>
  <span class="yr" id="year"></span>
</nav>

<header class="hero" id="top">
  <h1 class="sr-only" id="title"></h1>
  <div class="map"><div class="globe" id="globe">
    <canvas></canvas>
    <svg xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="pin-glow"><stop offset="0" stop-color="#FFB08F" stop-opacity=".95"/><stop offset=".3" stop-color="#FF9A76" stop-opacity=".45"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient></defs><g id="pins"></g></svg>
    <div class="zoom"><button type="button" aria-label="Zoom in">+</button><button type="button" aria-label="Zoom out">−</button></div>
    <div class="globe-hint" aria-hidden="true">Hold Ctrl and scroll to zoom</div>
  </div></div>
  <div class="stats" id="stats">
    <div class="stat"><b id="members"></b><span>Members</span></div>
    <div class="stat"><b id="countries"></b><span>Countries</span></div>
  </div>
  <div class="hero-cta" id="hero-cta" hidden><a class="btn-ghost" href="#region-note">What Americas members can do for now<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a></div>
</header>

<section id="community"><div class="wrap">
  <div class="sec-head reveal">
    <div><div class="idx">Community</div><h2 id="intro-title"></h2></div>
    <p class="lead" id="tagline"></p>
  </div>
  <div class="chips reveal" id="chips"></div>
  <div class="quote reveal" id="quote"></div>
</div></section>

<section class="acts" id="activities"><div class="wrap">
  <div class="sec-head reveal"><div><div class="idx">Activities</div><h2 id="activities-title"></h2></div></div>
  <div class="region-tabs reveal" role="tablist" aria-label="Region"></div>
  <div class="grid reveal" id="cards"></div>
</div></section>

<section class="next" id="next"><div class="wrap">
  <div class="sec-head reveal"><div><div class="idx">Schedule</div><h2 id="nextup-title"></h2></div></div>
  <div class="region-tabs reveal" role="tablist" aria-label="Region"></div>
  <div class="ticket reveal" id="ticket"></div>
</div></section>

<section id="join"><div class="wrap join-split">
  <div class="join-intro reveal">
    <div class="idx">Join</div>
    <h2 id="join-title"></h2>
    <p class="lead" id="join-sub"></p>
    <div class="rec"><p id="join-rec"></p></div>
  </div>
  <div class="join-side reveal">
    <div class="need"><div class="eyebrow" id="need-title"></div><ul id="need-list"></ul></div>
    <div class="contact" id="contact"></div>
  </div>
</div></section>

<footer id="foot"></footer>

<script src="assets/countries.js"></script>
<script src="assets/globe.js"></script>
<script src="assets/render.js"></script>
<script>
// Inside the admin preview (?preview), the admin page sends the content to show.
if (new URLSearchParams(location.search).has('preview')) {
  addEventListener('message', e => {
    if (e.origin !== location.origin) return;
    if (e.data?.type === 'cce-preview') renderPage(e.data.content);
    if (e.data?.type === 'cce-scroll') document.getElementById(e.data.id)?.scrollIntoView({ behavior: 'smooth' });
  });
  parent.postMessage({ type: 'cce-preview-ready' }, location.origin);
} else {
  // Saved content from the admin page first; the bundled default if nothing is saved (or offline / local preview).
  const load = url => fetch(url, { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)));
  load('/api/content')
    .then(c => c || Promise.reject(new Error('nothing saved yet')))
    // Region notes are not edited in the admin page yet, so saved content takes them from the bundled default
    .then(c => load('data/default-content.json').then(d => {
      (c.regions || []).forEach(r => { r.note ??= d.regions?.find(x => x.id === r.id)?.note; });
      return c;
    }, () => c))
    .catch(() => load('data/default-content.json'))
    .then(c => renderPage(c))
    .catch(e => { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:80px 20px;color:#D97757">Could not load content: ' + e.message + '</p>'); })
    .finally(() => dispatchEvent(new Event('page-rendered'))); // the intro waits for this, so the page is not laid out mid-flight
}

// Nav turns solid once the hero is scrolled past (like tesla.com)
const nav = document.getElementById('nav'), hero = document.getElementById('top');
const onScroll = () => nav.classList.toggle('solid', window.scrollY > hero.offsetHeight - 70);
addEventListener('scroll', onScroll, { passive: true }); onScroll();

// Sections fade up gently as they come into view
if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.documentElement.classList.add('js-reveal');
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -10% 0px' });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
}
</script>
</body>
</html>
